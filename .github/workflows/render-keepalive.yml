name: Keep Render service awake

on:
  schedule:
    - cron: '1,11,21,31,41,51 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping the bot health endpoint
        run: >-
          curl --fail --silent --show-error
          --max-time 90
          --retry 3 --retry-delay 5 --retry-all-errors
          https://makkatullohim-github-io.onrender.com/health
